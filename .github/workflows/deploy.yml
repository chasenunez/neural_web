name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # GitHub Pages serves user/org sites from the repo subpath. For a
          # repo named "neural_web" published as <user>.github.io/neural_web,
          # the base path is /neural_web/. The expression below derives it
          # from the repo name so a fork just works.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_VAULT_REPO:       ${{ secrets.VITE_VAULT_REPO }}
          VITE_DROPBOX_APP_KEY:  ${{ secrets.VITE_DROPBOX_APP_KEY }}
          VITE_DROPBOX_PHOTOS_PATH: ${{ vars.VITE_DROPBOX_PHOTOS_PATH }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
